name: plausible-traffic-notify

services:
  plausible_db:
    image: postgres:16-alpine
    restart: "no"
    ports:
      - "127.0.0.1:18184:5432"
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: plausible_db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  plausible_events_db:
    image: clickhouse/clickhouse-server:24.12-alpine
    restart: "no"
    ports:
      - "127.0.0.1:18185:8123"
    volumes:
      - ./clickhouse/logs.xml:/etc/clickhouse-server/config.d/logs.xml:ro
      - ./clickhouse/ipv4-only.xml:/etc/clickhouse-server/config.d/ipv4-only.xml:ro
      - ./clickhouse/low-resources.xml:/etc/clickhouse-server/config.d/low-resources.xml:ro
      - ./clickhouse/default-profile-low-resources-overrides.xml:/etc/clickhouse-server/users.d/default-profile-low-resources-overrides.xml:ro
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    environment:
      CLICKHOUSE_SKIP_USER_SETUP: "1"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --no-verbose --tries=1 -O - http://127.0.0.1:8123/ping || exit 1",
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  plausible:
    image: ${PLAUSIBLE_IMAGE:-plausible-lab:d44e104ae3943a}
    restart: "no"
    command:
      - /bin/sh
      - -c
      - /entrypoint.sh db createdb && /entrypoint.sh db migrate && /entrypoint.sh run
    depends_on:
      plausible_db:
        condition: service_healthy
      plausible_events_db:
        condition: service_healthy
    ports:
      - "127.0.0.1:18183:8000"
    volumes:
      - plausible-data:/var/lib/plausible
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    environment:
      TMPDIR: /var/lib/plausible/tmp
      BASE_URL: http://127.0.0.1:18183
      SECRET_KEY_BASE: plausible-traffic-notify-lab-secret-key-base-64bytes-minimum-xxxx
      DATABASE_URL: postgresql://postgres:postgres@plausible_db:5432/plausible_db
      CLICKHOUSE_DATABASE_URL: http://plausible_events_db:8123/plausible_events_db
      ENABLE_EMAIL_VERIFICATION: "false"
      DISABLE_REGISTRATION: "false"
      MAILER_ADAPTER: Bamboo.LocalAdapter
      HTTP_PORT: "8000"
      LISTEN_IP: 0.0.0.0

volumes:
  plausible-data:
